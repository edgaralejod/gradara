# SPDX-License-Identifier: Apache-2.0
# Installers for Windows (NSIS), macOS (DMG, per architecture), and Linux (AppImage, deb).
# Run from desktop/ after `npm run desktop:prepare` at the repository root.
appId: us.virtu-services.gradara
productName: Gradara
copyright: Copyright 2026 Edgar Duarte and the Gradara contributors
# Version-less names give the product page stable "latest" download links.
artifactName: Gradara-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - main.cjs
  - preload.cjs
  - package.json
  - "!**/*.map"
asar: true
extraResources:
  - from: ../build/backend/gradara-backend
    to: backend
  - from: ../dist-desktop/web
    to: web
  - from: ../models/examples
    to: app-resources/models/examples
  - from: ../server/engine_runner.py
    to: app-resources/server/engine_runner.py
  - from: ../Dockerfile.engine
    to: app-resources/Dockerfile.engine
  - from: ../LICENSE
    to: legal/LICENSE
  - from: ../NOTICE
    to: legal/NOTICE
  - from: ../THIRD_PARTY_NOTICES.md
    to: legal/THIRD_PARTY_NOTICES.md
  - from: ../LICENSES
    to: legal/LICENSES
publish:
  provider: github
  owner: edgaralejod
  repo: gradara
  releaseType: draft

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  # Signing: the release workflow maps the WIN_CERTIFICATE_PFX / WIN_CERTIFICATE_PASSWORD secrets
  # to CSC_LINK / CSC_KEY_PASSWORD, or configure Azure Trusted Signing
  # (azureSignOptions) in CI. Unsigned builds show a SmartScreen warning.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Gradara
  uninstallDisplayName: Gradara
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
    - target: zip
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  title: Gradara ${version}

linux:
  executableName: gradara
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  icon: build/icon.png
  synopsis: Graphical multidomain simulation with OpenModelica
  description: >-
    Build block diagrams of electrical, mechanical, thermal, and control systems and simulate
    them with OpenModelica. Optional AI features create blocks and models from a description.
  maintainer: Virtu Services LLC <support@virtu-services.us>
deb:
  packageName: gradara
  # OpenModelica's own packages provide the native engine; Docker works as an alternative.
  recommends: []
