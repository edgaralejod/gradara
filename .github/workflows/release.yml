name: Desktop installers

# Builds Windows, macOS, and Linux installers, each with its platform's built-in
# simulation engine (built and tested first by the Engine bundles workflow, in
# this same run), then installs each one on a
# clean runner, launches it in self-test mode, runs a simulation and verifies
# generated C with the built-in engine, and uninstalls it. Tag pushes (v*)
# attach the installers to a draft GitHub Release only when every install test
# passes. Pull requests and manual runs build and test without releasing. Engines
# whose inputs have not changed since the last push to main come from the cache
# that Engine cache fills (engine-cache.yml), so a tag build of an app change takes
# minutes, not the hour the four engines take to build and test.
#
# Pull requests run this only when they change packaging itself: other app
# changes are covered by Core CI and are built on the tag, which releases
# nothing unless every install test passes. Version bumps alone (the two
# package files) do not trigger it. Use Run workflow to build any branch.
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '!desktop/package.json'
      - '!desktop/package-lock.json'
      - 'packaging/**'
      - 'server/requirements.txt'
      - 'server/engines.py'
      - 'vite.desktop.config.ts'
      - '.github/workflows/engine-bundle.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  engine:
    name: Engine
    uses: ./.github/workflows/engine-bundle.yml
    with:
      test: true

  build:
    name: ${{ matrix.name }}
    needs: engine
    # Build every platform whose engine succeeded; the release job still needs all of them.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            builder: --win nsis --x64
            engine: windows-x64
          - name: macOS Apple silicon
            os: macos-15
            builder: --mac dmg zip --arm64
            engine: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            builder: --mac dmg zip --x64
            engine: macos-x64
          # 22.04 keeps the bundled service compatible with older Linux glibc versions.
          - name: Linux x64
            os: ubuntu-22.04
            builder: --linux AppImage deb --x64
            engine: linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app=$(node -p "require('./desktop/package.json').version")
          root=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$app" ] || [ "$root" != "$app" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version (desktop/package.json $app, package.json $root). Run 'npm version X.Y.Z --no-git-tag-version' in both folders, merge, then tag."
            exit 1
          fi
      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          python -m pip install -r server/requirements.txt pyinstaller==6.22.3
          cd desktop && npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine-${{ matrix.engine }}
          path: dist-engine
      - name: Unpack the built-in engine
        shell: bash
        run: python packaging/engine/fetch_bundle.py --name ${{ matrix.engine }} --from dist-engine
      - name: Build workbench and local service
        shell: bash
        run: |
          npm run desktop:web
          python packaging/build_backend.py
          python packaging/third_party_licenses.py
      - name: Smoke-test the bundled service
        # On Windows and Linux this also simulates with the built-in engine.
        shell: bash
        run: python packaging/smoke_backend.py
      - name: Load a personal-feature layer into the bundled service
        # The loader must work on every platform: the frozen service has to run a
        # layer's complete server package (including a module the base lacks) and
        # serve its workbench. See docs/architecture/LAYERS.md.
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo '[{"id":"loading-test","title":"Loading test"}]' > "$RUNNER_TEMP/features.json"
          node scripts/build-layer.cjs build --id loading-test --base "$version" \
            --features "$RUNNER_TEMP/features.json" --out "$RUNNER_TEMP/layer"
          node scripts/build-layer.cjs unpack "$RUNNER_TEMP/layer/gradara-layer-$version-loading-test.tar.gz" "$RUNNER_TEMP/layer/unpacked"
          python packaging/layer_probe.py "$RUNNER_TEMP/layer/unpacked"
          python packaging/smoke_backend.py --layer "$RUNNER_TEMP/layer/unpacked" --probe
      - name: Smoke-test the bundled service on Arch Linux
        # A rolling distribution's /bin/sh, make, and gcc are newer than the build
        # machine's libraries; the service must not hand those to them.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src" -w /src archlinux:latest bash -c \
            'pacman -Sy --noconfirm --needed gcc python >/dev/null && python packaging/smoke_backend.py'
      - name: Build installer
        shell: bash
        working-directory: desktop
        env:
          # Optional signing secrets. They are passed on only when set: an empty
          # CSC_LINK makes electron-builder try to sign with a missing file on
          # tag builds (pull-request builds always skip signing, so they hide it).
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          WIN_CERTIFICATE_PFX: ${{ secrets.WIN_CERTIFICATE_PFX }}
          WIN_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
          SIGN_APPLE_ID: ${{ secrets.APPLE_ID }}
          SIGN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SIGN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CERTIFICATE_P12" ]; then
            export CSC_LINK="$MAC_CERTIFICATE_P12" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
            if [ -n "$SIGN_APPLE_ID" ]; then
              export APPLE_ID="$SIGN_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$SIGN_APPLE_APP_SPECIFIC_PASSWORD" \
                APPLE_TEAM_ID="$SIGN_APPLE_TEAM_ID"
            fi
            echo "Signing with the configured Developer ID certificate"
          elif [ "$RUNNER_OS" = Windows ] && [ -n "$WIN_CERTIFICATE_PFX" ]; then
            export CSC_LINK="$WIN_CERTIFICATE_PFX" CSC_KEY_PASSWORD="$WIN_CERTIFICATE_PASSWORD"
            echo "Signing with the configured Windows certificate"
          else
            # No certificate: build unsigned, and do not pick up a stray identity from the keychain.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "No signing certificate configured; building unsigned"
          fi
          npx electron-builder ${{ matrix.builder }} --publish never
      - name: Name macOS update metadata by architecture
        if: runner.os == 'macOS'
        shell: bash
        working-directory: desktop/dist
        # Both Mac jobs write latest-mac.yml; the release job merges them.
        run: mv latest-mac.yml "latest-mac-$(uname -m).yml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradara-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.yml
            desktop/dist/*.blockmap
            !desktop/dist/builder-debug.yml
          if-no-files-found: error

  install-test:
    name: Install test / ${{ matrix.name }}
    needs: build
    # Test whatever built, even if another platform's build failed.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # simulate: run the DC motor on the built-in engine and verify its generated C.
        # GitHub's Apple silicon runners cannot start virtual machines (no nested
        # virtualization), so that installer's simulation is checked on a Mac before
        # publishing (docs/RELEASING.md); the Intel runner boots the same VM design.
        include:
          - name: Windows x64
            os: windows-latest
            artifact: gradara-windows-latest
            simulate: '--simulate'
          - name: macOS Apple silicon
            os: macos-15
            artifact: gradara-macos-15
            simulate: ''
          - name: macOS Intel
            os: macos-15-intel
            artifact: gradara-macos-15-intel
            simulate: '--simulate'
          - name: Ubuntu 22.04
            os: ubuntu-22.04
            artifact: gradara-ubuntu-22.04
            simulate: '--simulate'
          - name: Ubuntu 24.04
            os: ubuntu-24.04
            artifact: gradara-ubuntu-22.04
            simulate: '--simulate'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: packaging
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: installers
      - name: Show installers
        shell: bash
        run: ls -la installers

      # Windows: per-user NSIS install, two launches, silent uninstall.
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem installers/Gradara-win-x64.exe
          $p = Start-Process $installer.FullName -ArgumentList '/S', '/currentuser' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Gradara'
          if (-not (Test-Path "$dir\Gradara.exe")) { throw "Gradara.exe not found in $dir" }
          if (-not (Test-Path "$dir\resources\backend\gradara-backend.exe")) { throw 'Bundled service missing' }
          if (-not (Test-Path "$dir\resources\engine\bin\omc.exe")) { throw 'Built-in engine missing' }
          $key = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like 'Gradara*' }
          if (-not $key) { throw 'No Add/Remove Programs entry' }
          $startMenu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Gradara.lnk'
          if (-not (Test-Path $startMenu)) { throw 'Start menu shortcut missing' }
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Gradara.lnk'
          if (-not (Test-Path $desktop)) { throw 'Desktop shortcut missing' }
          "GRADARA_EXE=$dir\Gradara.exe" >> $env:GITHUB_ENV
          "GRADARA_DIR=$dir" >> $env:GITHUB_ENV
          Write-Host "Installed to $dir"

      # macOS: copy from the DMG to /Applications, as a user would.
      - name: Install (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls installers/Gradara-mac-*.dmg)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint /Volumes/GradaraTest
          test -L /Volumes/GradaraTest/Applications || { echo 'DMG has no Applications link'; exit 1; }
          cp -R /Volumes/GradaraTest/Gradara.app /Applications/
          hdiutil detach /Volumes/GradaraTest
          exe=/Applications/Gradara.app/Contents/MacOS/Gradara
          file "$exe"
          file /Applications/Gradara.app/Contents/Resources/backend/gradara-backend
          file /Applications/Gradara.app/Contents/Resources/engine/vfkit
          codesign -d --entitlements - /Applications/Gradara.app/Contents/Resources/engine/vfkit 2>&1 | grep -q com.apple.security.virtualization \
            || { echo 'vfkit lacks the virtualization entitlement'; exit 1; }
          # Authority lines (the signing certificate chain) are only printed at -vv or higher.
          signature=$(codesign -dvv /Applications/Gradara.app 2>&1 || true)
          echo "$signature"
          if grep -q "Developer ID Application" <<<"$signature"; then
            # Signed builds must pass the same checks a user's Mac runs on first open.
            codesign --verify --deep --strict --verbose=2 /Applications/Gradara.app
            spctl --assess --type execute --verbose=4 /Applications/Gradara.app
            xcrun stapler validate /Applications/Gradara.app
            echo "Signed, notarized, and accepted by Gatekeeper"
          else
            echo "::notice::Unsigned macOS build: users must allow it in System Settings > Privacy & Security on first open"
          fi
          echo "GRADARA_EXE=$exe" >> "$GITHUB_ENV"

      # Linux: the .deb through apt, like a double-click install.
      - name: Install (Linux .deb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb ./installers/Gradara-linux-amd64.deb
          test -x /opt/Gradara/gradara
          test -x /opt/Gradara/resources/backend/gradara-backend
          test -x /opt/Gradara/resources/engine/bin/omc
          dpkg-query -W -f='${Depends}\n' gradara | grep -q gcc
          test -f /usr/share/applications/gradara.desktop
          command -v gradara
          echo "GRADARA_EXE=/opt/Gradara/gradara" >> "$GITHUB_ENV"

      - name: First launch (simulates on the built-in engine)
        shell: bash
        run: |
          mkdir -p reports
          if [ -z "${{ matrix.simulate }}" ]; then
            echo "::notice::This runner cannot start the engine VM; the Apple silicon simulation is checked on a Mac before release."
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python packaging/installer_selftest.py --exe "$GRADARA_EXE" --report reports/first-launch.json ${{ matrix.simulate }}
          else
            python packaging/installer_selftest.py --exe "$GRADARA_EXE" --report reports/first-launch.json ${{ matrix.simulate }}
          fi
      - name: Second launch (existing data folder)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python packaging/installer_selftest.py --exe "$GRADARA_EXE" --report reports/second-launch.json
          else
            python packaging/installer_selftest.py --exe "$GRADARA_EXE" --report reports/second-launch.json
          fi

      - name: Uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $uninstaller = Join-Path $env:GRADARA_DIR 'Uninstall Gradara.exe'
          Start-Process $uninstaller -ArgumentList '/S', '/currentuser' -Wait
          # The NSIS uninstaller re-launches itself from a temporary copy; wait for it.
          $deadline = (Get-Date).AddSeconds(90)
          while ((Test-Path "$env:GRADARA_DIR\Gradara.exe") -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          if (Test-Path "$env:GRADARA_DIR\Gradara.exe") { throw 'Program files remain after uninstall' }
          $key = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like 'Gradara*' }
          if ($key) { throw 'Add/Remove Programs entry remains' }
          if (Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Gradara.lnk')) { throw 'Start menu shortcut remains' }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Gradara.lnk')) { throw 'Desktop shortcut remains' }
          # Models are the user's work: uninstalling keeps them.
          if (-not (Test-Path (Join-Path $env:APPDATA 'Gradara\data'))) { throw 'User data folder was removed' }
          Write-Host 'Uninstalled cleanly; user data kept.'
      - name: Uninstall (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /Applications/Gradara.app
          test ! -e /Applications/Gradara.app
          test -d "$HOME/Library/Application Support/Gradara/data"
          echo 'Removed; user data kept.'
      - name: Uninstall (Linux .deb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove -y -qq gradara
          status=$(dpkg-query -W -f='${db:Status-Abbrev}' gradara 2>/dev/null || true)
          if [ "${status:0:2}" = ii ]; then echo 'package still installed'; exit 1; fi
          test ! -e /opt/Gradara/gradara
          test ! -e /usr/share/applications/gradara.desktop
          if command -v gradara; then echo 'gradara still on PATH'; exit 1; fi
          test -d "$HOME/.config/Gradara/data"
          echo 'Uninstalled cleanly; user data kept.'

      - name: macOS ZIP (update package) launches
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zipped && ditto -x -k installers/Gradara-mac-*.zip zipped
          python packaging/installer_selftest.py --exe zipped/Gradara.app/Contents/MacOS/Gradara --report reports/zip.json
      - name: AppImage launches
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libfuse2 || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libfuse2t64
          chmod +x installers/Gradara-linux-x86_64.AppImage
          xvfb-run -a python packaging/installer_selftest.py --exe installers/Gradara-linux-x86_64.AppImage --report reports/appimage.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: install-test-${{ matrix.os }}
          path: reports
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v') && needs.engine.result == 'success' && needs.build.result == 'success' && needs.install-test.result == 'success'
    needs: [engine, build, install-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: gradara-*
          merge-multiple: true
      - name: Merge macOS update metadata
        run: |
          python3 -m pip install --quiet pyyaml==6.0.2
          python3 - <<'EOF'
          import glob, os, yaml
          parts = sorted(glob.glob('artifacts/latest-mac-*.yml'))
          if len(parts) != 2:
              raise SystemExit(f'expected two macOS update files, found {parts}')
          docs = [yaml.safe_load(open(path)) for path in parts]
          if docs[0]['version'] != docs[1]['version']:
              raise SystemExit('macOS builds report different versions')
          # Keep the Intel entry as the legacy top-level path; electron-updater
          # picks the file for the running architecture from the files list.
          base = next((d for d in docs if 'x64' in d['path']), docs[0])
          merged = dict(base)
          merged['files'] = [f for d in docs for f in d['files']]
          with open('artifacts/latest-mac.yml', 'w') as out:
              yaml.safe_dump(merged, out, sort_keys=False)
          for path in parts:
              os.remove(path)
          print(open('artifacts/latest-mac.yml').read())
          EOF
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Gradara ${GITHUB_REF_NAME#v}" --notes "Draft: review the notes and known limitations before publishing." \
            artifacts/*
