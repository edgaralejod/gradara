name: OpenModelica integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADARA_DOCKER_CONTEXT: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: python -m pip install -r server/requirements-dev.txt
      - name: Build the local numerical engine
        run: docker build -f Dockerfile.engine --build-arg ENGINE_UID="$(id -u)" -t gradara-engine:1.27.0 .
      - name: Unit and real-engine tests
        run: python -m pytest -q
