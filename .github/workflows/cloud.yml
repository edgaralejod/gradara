name: Gradara AI gateway

on:
  push:
    paths: ['cloud/**', 'server/llm/**', '.github/workflows/cloud.yml']
  pull_request:
    paths: ['cloud/**', 'server/llm/**', '.github/workflows/cloud.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud/requirements.txt
      - run: python -m pip install -r cloud/requirements.txt pytest==9.1.1 httpx2==2.13.0
      - run: python -m pytest -q
        working-directory: cloud
      - name: Container builds
        run: docker build -f cloud/Dockerfile -t gradara-gateway .
