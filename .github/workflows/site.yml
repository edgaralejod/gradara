name: Website

# Deploys site/ to Firebase Hosting (gradara-web.web.app). Pull requests get a
# temporary preview channel. Requires the FIREBASE_SERVICE_ACCOUNT_GRADARA_WEB secret.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: FirebaseExtended/action-hosting-deploy@0cbcac4740c2bfb00d632f0b863b57713124eb5a # v0.9.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GRADARA_WEB }}
          projectId: gradara-web
          entryPoint: site
          channelId: ${{ github.event_name == 'pull_request' && '' || 'live' }}
