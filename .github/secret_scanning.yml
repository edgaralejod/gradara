# Paths GitHub secret scanning skips. cloud/deploy.env holds the Firebase *web* API key,
# which only identifies the project to Firebase Auth and ships in the sign-in page by
# design (https://firebase.google.com/docs/projects/api-keys). Keep that key restricted
# in Google Cloud to the Identity Toolkit APIs and the site's referrers. Secrets live
# only in Secret Manager (cloud/README.md), never in the repository.
paths-ignore:
  - "cloud/deploy.env"
