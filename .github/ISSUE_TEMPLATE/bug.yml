name: Workbench bug
description: Report a reproducible editing, wiring, or UI problem.
body:
  - type: markdown
    attributes:
      value: "Use synthetic models. Do not include credentials or private project data. Security reports follow SECURITY.md."
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Starting model, exact steps, modifier keys, zoom, and whether undo/reload changes the behavior.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Gradara commit, OS, browser/version, and input device.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Small shareable project, screenshot/recording, and redacted browser/service diagnostics.
